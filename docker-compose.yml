services:
  n8n:
    # Versione fissata per rendere ripetibile la raccolta.
    image: n8nio/n8n:2.23.4
    container_name: cti_n8n
    # Necessario per scrivere nel bind mount data/raw su Windows.
    user: "root"
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Rome
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?definire N8N_ENCRYPTION_KEY nel file .env}
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_USER_FOLDER=/home/node
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
      # Gli archivi completi richiedono più heap e dati binari su disco.
      - NODE_OPTIONS=--max-old-space-size=4096
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      # I nodi Code calcolano SHA-256 leggendo i file a blocchi.
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto,fs
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data/raw:/data/raw

  neo4j:
    image: neo4j:2026.07.1-community
    container_name: cti_neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?definire NEO4J_PASSWORD nel file .env}
    volumes:
      - neo4j_data:/data

volumes:
  n8n_data:
  neo4j_data:
